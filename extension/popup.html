<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send to SNAG</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div class="brand"><img src="logo.png" alt="" width="40" height="40"><strong>SNAG</strong></div><span>From browser to file.</span></header>
<p>Send this page to SNAG, then choose video quality or MP3.</p>
<label class="sr-only" for="page">Link to send</label>
<input id="page" class="page" type="url" spellcheck="false" autocomplete="off" placeholder="https://">
<button id="send">Send this page to SNAG</button>
<p id="status" role="status" aria-live="polite"></p>
<footer>Extension <span id="ver">?</span> &middot; Start the SNAG Windows app first. On X, Instagram and TikTok, allow this extension&rsquo;s site access to show the page button.</footer>
<script src="popup.js"></script></body></html>
